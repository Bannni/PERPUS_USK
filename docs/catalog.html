<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library - Rak Buku Koleksi Saya</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: { 50: '#FDFBF7', 100: '#FAF7F0', 200: '#F5EFEB', 300: '#EFE7DD', 400: '#E2D5C4', 500: '#D5C4AF' },
                        amberWood: { 50: '#FBF7F2', 100: '#F4ECE1', 200: '#E7D8C5', 300: '#D7BEA2', 400: '#C59E7A', 500: '#B0825B', 600: '#946645', 700: '#7A5034', 800: '#5F3D27', 900: '#3D2719' },
                    },
                    fontFamily: {
                        serif: ['Fraunces', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="./data.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF7F2; color: #2D231E; }
        .font-serif { font-family: 'Fraunces', serif; }
        [x-cloak] { display: none !important; }

        .shelf-container {
            position: relative;
        }
        .shelf-surface {
            height: 10px;
            background: linear-gradient(180deg, #F5ECE0 0%, #E9DECD 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 4px 4px 0 0;
            position: relative;
            z-index: 5;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        .shelf-face {
            height: 14px;
            background: linear-gradient(180deg, #DFD4C3 0%, #D2C4AF 100%);
            border-bottom: 2px solid #B8A892;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 12px 18px -2px rgba(60, 42, 28, 0.14), 0 4px 6px -2px rgba(60, 42, 28, 0.08);
            position: relative;
            z-index: 4;
        }
        .book-wrapper {
            position: relative;
            z-index: 10;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: bottom center;
        }
        .book-wrapper:hover {
            transform: translateY(-10px) scale(1.03);
            z-index: 20;
        }
        .book-cover {
            box-shadow: -4px 6px 14px rgba(45, 30, 20, 0.22), 0 2px 4px rgba(45, 30, 20, 0.12);
            position: relative;
            overflow: hidden;
            border-radius: 3px 6px 6px 3px;
        }
        .book-cover::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 8px;
            background: linear-gradient(90deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.2) 100%);
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen bg-[#FAF7F2] text-[#2D231E]"
      x-data="{
          search: '',
          selectedBook: null,
          modalOpen: false,
          cartCount: READOWL_DATA.getCart().reduce((sum, item) => sum + item.quantity, 0),
          get genres() {
              const list = {};
              READOWL_DATA.books.forEach(b => {
                  if (this.search.trim()) {
                      const q = this.search.toLowerCase();
                      if (!b.title.toLowerCase().includes(q) && !b.author.toLowerCase().includes(q)) return;
                  }
                  if (!list[b.category]) list[b.category] = [];
                  list[b.category].push(b);
              });
              return list;
          },
          openBook(book) {
              this.selectedBook = book;
              this.modalOpen = true;
              this.$nextTick(() => lucide.createIcons());
          },
          init() {
              window.addEventListener('cart-updated', (e) => {
                  this.cartCount = e.detail.reduce((sum, item) => sum + item.quantity, 0);
              });
              this.$nextTick(() => lucide.createIcons());
          }
      }">

    <!-- Top Unified Navbar -->
    <header class="sticky top-0 z-40 bg-[#FAF7F2]/90 backdrop-blur-md border-b border-[#EFE5D7]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 py-4 flex items-center justify-between">
            <a href="./index.html" class="flex items-center gap-2.5">
                <span class="font-serif text-xl sm:text-2xl font-bold tracking-tight text-[#4A3222]">READOWL</span>
            </a>

            <div class="flex items-center gap-6 text-xs uppercase tracking-wider font-semibold text-[#73685E]">
                <a href="./shop.html" class="hover:text-[#4A3222] transition text-[#7A5034]">Toko Buku</a>
                <a href="./catalog.html" class="text-[#4A3222] font-bold">Rak Koleksi</a>
                <a href="./cart.html" class="relative p-1.5 text-[#7A5034] hover:bg-[#E2DDD3] rounded-full transition">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span x-show="cartCount > 0" x-text="cartCount" class="absolute -top-1 -right-1 w-4 h-4 bg-[#7A5034] text-white rounded-full text-[9px] font-bold flex items-center justify-center"></span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN BOOKCASE CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
        <div>
            <!-- Top Controls: Header and Search Bar -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <!-- Info Label -->
                <div>
                    <div class="flex items-center gap-2.5">
                        <h1 class="font-serif text-2xl sm:text-3xl font-bold text-[#5F3D27]">My Library (Rak Koleksi Buku)</h1>
                        <span class="text-xs px-2.5 py-0.5 rounded-full bg-[#EFE5D7] text-[#7A5034] font-semibold">
                            <span x-text="READOWL_DATA.books.length"></span> Buku Resmi Dikoleksi
                        </span>
                    </div>
                    <p class="text-xs sm:text-sm text-[#8C7A6D] mt-1">Daftar buku fisik yang telah Anda beli dan tersusun rapi di rak 3D berdasarkan genrenya.</p>
                </div>

                <!-- Search & Shop Action -->
                <div class="flex items-center gap-3">
                    <div class="relative max-w-xs w-full">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-[#A8988B]"></i>
                        <input type="text" 
                               x-model="search"
                               placeholder="Cari di rak saya..." 
                               class="w-full pl-10 pr-4 py-2 bg-[#F1E8DC]/80 hover:bg-[#F1E8DC] focus:bg-white text-xs md:text-sm text-[#4A3222] placeholder-[#A8988B] rounded-xl border border-[#E4D7C5] focus:outline-none focus:ring-2 focus:ring-[#B0825B]/40 focus:border-[#B0825B] transition">
                    </div>

                    <a href="./shop.html" class="px-4 py-2 bg-[#7A5034] hover:bg-[#5F3D27] text-white text-xs font-semibold rounded-xl shadow-xs transition flex items-center gap-1.5 shrink-0">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>Beli Buku Baru</span>
                    </a>
                </div>
            </div>

            <!-- SHELVES VIEW (GROUPED BY GENRE / KATEGORI BUKU) -->
            <div class="space-y-12">
                <template x-for="(books, genre) in genres" :key="genre">
                    <section class="shelf-container bg-white/60 border border-[#EBE1D3] rounded-3xl p-6 sm:p-8 shadow-xs">
                        <div class="flex items-center justify-between mb-4 px-1">
                            <div class="flex items-center gap-2.5">
                                <span class="w-3 h-3 rounded-full bg-[#B0825B]"></span>
                                <h3 class="font-serif text-lg md:text-xl font-bold text-[#5F3D27] tracking-tight" x-text="'Genre: ' + genre"></h3>
                            </div>
                            <span class="text-xs text-[#9C8B7E] font-medium"><span x-text="books.length"></span> buku dikoleksi</span>
                        </div>

                        <!-- Books On Genre Shelf -->
                        <div class="relative pt-6 pb-0 px-4 md:px-8 flex items-end gap-6 sm:gap-8 md:gap-12 overflow-x-auto min-h-[210px] no-scrollbar">
                            <template x-for="book in books" :key="book.id">
                                <div class="book-wrapper cursor-pointer shrink-0 group" @click="openBook(book)">
                                    <div class="w-24 sm:w-28 md:w-32 aspect-[2/3] book-cover bg-[#E9DECD] shadow-md group-hover:shadow-xl transition duration-300">
                                        <img :src="book.cover_url" 
                                             :alt="book.title" 
                                             class="w-full h-full object-cover">
                                    </div>
                                    <div class="text-center mt-2.5 w-24 sm:w-28 md:w-32">
                                        <p class="text-[11px] font-semibold text-[#4A3222] truncate group-hover:text-[#7A5034] transition" x-text="book.title"></p>
                                        <p class="text-[9px] text-[#8C7A6D] truncate" x-text="book.author"></p>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- 3D Shelf Ledge -->
                        <div class="shelf-surface mt-2"></div>
                        <div class="shelf-face"></div>
                    </section>
                </template>
            </div>

        </div>

        <!-- Footer Notice -->
        <div class="pt-8 mt-12 border-t border-[#EFE5D7] flex flex-col sm:flex-row items-center justify-between text-xs text-[#9C8B7E] gap-2">
            <p>&copy; 2026 Readowl Bookstore &bull; Toko Buku Resmi & Pengiriman ke Rumah</p>
            <div class="flex items-center gap-4">
                <a href="./shop.html" class="hover:text-[#5F3D27] font-semibold text-[#7A5034]">Toko Buku (Shop)</a>
                <span>&bull;</span>
                <a href="./index.html" class="hover:text-[#5F3D27] underline">Halaman Utama</a>
            </div>
        </div>
    </main>

    <!-- BOOK DETAIL MODAL -->
    <div x-show="modalOpen" 
         x-cloak
         style="display: none;"
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs"
         @keydown.escape.window="modalOpen = false">
        
        <div class="bg-[#FAF7F2] border border-[#E7DBCB] rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative overflow-hidden"
             @click.away="modalOpen = false">
            
            <button @click="modalOpen = false" class="absolute top-4 right-4 p-2 text-[#9C8B7E] hover:text-[#4A3222] hover:bg-[#EFE5D7] rounded-full transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <template x-if="selectedBook">
                <div class="flex flex-col sm:flex-row gap-6">
                    <div class="w-36 sm:w-44 aspect-[2/3] shrink-0 mx-auto sm:mx-0 rounded-xl overflow-hidden shadow-lg border border-[#DACBB8] bg-[#E9DECD]">
                        <img :src="selectedBook.cover_url" 
                             :alt="selectedBook.title" 
                             class="w-full h-full object-cover">
                    </div>

                    <div class="flex-1 flex flex-col justify-between">
                        <div>
                            <span class="inline-block text-[11px] font-bold uppercase tracking-wider text-[#9C6D47] bg-[#EFE4D6] px-2.5 py-0.5 rounded-full" x-text="'Genre: ' + selectedBook.category"></span>
                            
                            <h3 class="font-serif text-2xl font-bold text-[#4A3222] mt-2 leading-tight" x-text="selectedBook.title"></h3>
                            <p class="text-sm text-[#7A6B60] mt-0.5 font-medium" x-text="'Penulis: ' + selectedBook.author"></p>

                            <div class="flex items-center gap-4 mt-3 text-xs text-[#8C7A6D]">
                                <div class="flex items-center text-amber-600 font-bold gap-1">
                                    <span>&starf;</span>
                                    <span x-text="selectedBook.rating"></span>
                                </div>
                                <span>&bull;</span>
                                <span x-text="selectedBook.pages + ' Halaman'"></span>
                                <span>&bull;</span>
                                <span x-text="'Tahun: ' + (selectedBook.published_year || '-')"></span>
                            </div>

                            <div class="mt-4">
                                <h4 class="text-xs font-bold uppercase text-[#8C7A6D] tracking-wider mb-1">Sinopsis</h4>
                                <p class="text-xs text-[#5D4F46] leading-relaxed line-clamp-4" x-text="selectedBook.synopsis || selectedBook.description"></p>
                            </div>
                        </div>

                        <div class="mt-6 pt-4 border-t border-[#E8DDCE] flex flex-col sm:flex-row items-center justify-between gap-3">
                            <span class="text-xs font-bold text-emerald-800 bg-emerald-100 px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-xs">
                                <i data-lucide="package-check" class="w-4 h-4 text-emerald-700"></i>
                                Buku Fisik Resmi Dimiliki
                            </span>
                            <div class="flex items-center gap-2">
                                <a href="./cart.html" class="px-4 py-2 bg-[#EFE4D6] hover:bg-[#E5D7C5] text-[#5F3D27] text-xs font-semibold rounded-xl transition flex items-center gap-1.5">
                                    <i data-lucide="receipt" class="w-3.5 h-3.5"></i>
                                    <span>Bukti Pembelian</span>
                                </a>
                                <button type="button" @click="modalOpen = false" class="px-4 py-2 bg-[#7A5034] hover:bg-[#5F3D27] text-white text-xs font-bold rounded-xl shadow-xs transition">
                                    Tutup
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</body>
</html>
